name: Build
on:
  pull_request:
  push:
    branches: [master]
    tags: ['*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build
        run: bash ./gradlew --no-daemon clean :plugin:test build
      - uses: actions/upload-artifact@v4
        with:
          name: musicbox
          path: |
            build/libs/MusicBox-*.jar
            !build/libs/*-thin.jar
          if-no-files-found: error
